name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PHP 8.5 / PostgreSQL 18 / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rehla_testing
      DB_USERNAME: rehla
      DB_PASSWORD: rehla_testing_password
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rehla_testing
          POSTGRES_USER: rehla
          POSTGRES_PASSWORD: rehla_testing_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, json, mbstring, pdo_pgsql, tokenizer, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Rebuild the test schema
        run: php artisan migrate:fresh --env=testing --force

      - name: Verify PHP and package contracts
        run: composer verify

      - name: Build frontend assets
        run: npm run build
